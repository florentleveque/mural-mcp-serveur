name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted Publishing (token-free, OIDC only) needs npm >= 11.5.1.
      # @semantic-release/npm shells out to the npm CLI, so the global npm
      # version is what matters here.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # npm auth uses Trusted Publishing: @semantic-release/npm exchanges the
      # job's OIDC token (id-token: write) for a short-lived publish token, so
      # no NPM_TOKEN secret is needed. Requires a trusted publisher configured
      # for this repo + release.yml in the package settings on npmjs.com.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
