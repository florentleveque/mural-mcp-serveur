name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The suite finishes in well under a minute; a wedged test or runner
    # should fail fast instead of holding the job for the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Deprecated config is only an `info`, which `--error-on-warnings` lets
      # through; `migrate` has no check mode, hence write-then-diff.
      - name: Biome config needs no migration
        run: |
          pnpm exec biome migrate --write
          git diff --exit-code biome.json

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
              console.log("| Metric | Coverage |\n| --- | --- |");
              ["lines","statements","functions","branches"].forEach((k) => console.log(row(k)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

      - run: pnpm build

      - run: pnpm pack --pack-destination .

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: '*.tgz'
          retention-days: 1
          if-no-files-found: error
