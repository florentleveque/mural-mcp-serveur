# Adapted from fruggr/zendesk-mcp-server (MIT, see THIRD-PARTY-NOTICES.md).
name: Mutation baseline cache
description: >-
  Set up Node/pnpm, compute the mutation baseline cache key, restore it. Both
  jobs use this so the invalidation rule below lives in exactly one place.

outputs:
  prefix:
    description: Restore-key prefix, matching any baseline built from the same inputs.
    value: ${{ steps.key.outputs.prefix }}
  exact:
    description: Full key for this commit. The save key; immutable once written.
    value: ${{ steps.key.outputs.exact }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # THE INVALIDATION RULE. Selection is mechanical, in two parts:
    #   1. the toolchain and runner inputs: lockfile (it also records the hash of
    #      the vitest-runner patch), package.json (its `packageManager` field is
    #      where pnpm/action-setup reads the pnpm version from), both configs,
    #      .nvmrc;
    #   2. every file under tests/ except *.test.ts and tests/functional/.
    # Part 2 is asserted by tests/unit/mutation-scope.test.ts, so this list
    # cannot drift silently. `src/**` and *.test.ts are absent on purpose:
    # Stryker's incremental mode diffs those itself. Why: the "CI" section of
    # docs/decisions/mutation-testing.md.
    #
    # Key = prefix + sha (cache entries are immutable, so a fixed key would
    # freeze the first baseline); the prefix restore-key is safe to fall back on
    # only because the inputs hash sits inside it.
    - name: Compute the baseline cache key
      id: key
      shell: bash
      env:
        PREFIX: mutation-baseline-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'stryker.config.mjs', 'vitest.config.ts', 'tests/unit/helpers.ts', '.nvmrc') }}
      run: |
        echo "prefix=${PREFIX}-" >> "$GITHUB_OUTPUT"
        echo "exact=${PREFIX}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Restore the mutation baseline
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: reports/mutation/stryker-incremental.json
        key: ${{ steps.key.outputs.exact }}
        restore-keys: ${{ steps.key.outputs.prefix }}
