# Which dependencies may run install scripts. pnpm refuses (and errors on) any
# script not listed here.
allowBuilds:
  # lefthook's postinstall only downloads its Go binary as a fallback; the
  # binary already ships in the platform optional dependency, so the CLI works
  # with the build script blocked. Kept false deliberately.
  lefthook: false

# 5 days. pnpm refuses any version younger than this when it resolves the tree,
# so a compromised release that gets yanked within that window never lands.
# Renovate only manages direct dependencies; this gate also covers transitive
# ones, refreshed by lockfile maintenance (see renovate.json).
minimumReleaseAge: 7200

# Carries the unmerged upstream fix stryker-js#6214: vitest 5 joins qualified
# test names with ' > ', so the runner's filter matched nothing, every mutant
# ran zero tests and came back Survived. Drop the patch once a release ships
# the fix. Background: docs/decisions/mutation-testing.md.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
